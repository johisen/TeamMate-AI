# TeamMateAI 一键部署配置
# 版本: v1.0
# 使用方法: docker-compose up -d

services:
  # TeamMateAI 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teammate-ai-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://teammate:teammate_secure_pass@postgres:5432/teammateai
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./data:/app/data
    networks:
      - teammate-network
    restart: unless-stopped

  # TeamMateAI 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teammate-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - teammate-network
    restart: unless-stopped

  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: teammate-ai-postgres
    environment:
      - POSTGRES_USER=teammate
      - POSTGRES_PASSWORD=teammate_secure_pass
      - POSTGRES_DB=teammateai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - teammate-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: teammate-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - teammate-network
    restart: unless-stopped

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: teammate-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - teammate-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local

networks:
  teammate-network:
    driver: bridge
